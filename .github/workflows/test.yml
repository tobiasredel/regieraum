name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DEEPFILTER_VERSION: "0.5.6"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PS_JOBS: "0"
      PS_HOST_AUTH: none
      PS_DATA: /home/runner/ps-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install DeepFilterNet binary
        run: |
          sudo curl -fsSL -o /usr/local/bin/deep-filter \
            "https://github.com/Rikorose/DeepFilterNet/releases/download/v${DEEPFILTER_VERSION}/deep-filter-${DEEPFILTER_VERSION}-x86_64-unknown-linux-musl"
          sudo chmod +x /usr/local/bin/deep-filter

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The pipeline tests download the faster-whisper "tiny" model; the pipeline puts the Hugging Face
      # cache under $PS_DATA/models.
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /home/runner/ps-data/models
          key: whisper-tiny-v1

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax (as ES modules)
        run: |
          status=0
          tmp="$(mktemp -d)"
          while IFS= read -r -d '' f; do
            cp "$f" "$tmp/check.mjs"
            if ! node --check "$tmp/check.mjs"; then
              echo "::error file=$f::syntax error"
              status=1
            fi
          done < <(find app/static/js -name '*.js' -print0)
          exit $status

      - name: Parse JSON dictionaries
        run: |
          status=0
          for f in app/static/i18n/*.json; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done
          exit $status
