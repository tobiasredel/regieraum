{% extends "_layout.html" %}
{% set active = "episodes" %}
{% block title %}{{ t("Folge prüfen") }}{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/manage.css?v={{ v }}">{% endblock %}
{% block content %}
<div class="m-page m-page-wide">
  <div id="app" data-episode="{{ episode_id }}">
    <p class="tr-small">{{ t("Folge wird geladen") }}</p>
    <noscript><p>{{ t("Diese Seite braucht JavaScript") }}</p></noscript>
  </div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/manage/episode.js?v={{ v }}"></script>{% endblock %}
